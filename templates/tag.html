{% extends 'base.html' %}
{% block head %}
<meta name="description" content="{{ blogBase['title'] }} search page">
<title>{{ blogBase['title'] }} - Tag</title>
{% endblock %}

{% block style %}
<style>
.tagTitle{margin:auto 0;font-size:40px;font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.title-right{display:flex;margin:auto 0 0 auto;}
.title-right .circle{padding: 14px 16px;margin-right:8px;}

.subnav-search{width:222px;margin-top:8px;margin-right:8px;}
.subnav-search-input{width:160px;border-top-right-radius:0px;border-bottom-right-radius:0px;}
.subnav-search button{padding:5px 8px;border-top-left-radius:0px;border-bottom-left-radius:0px;}

.SideNav-icon{margin-right:16px}
.Label{color: #fff;margin-left:4px;}
#taglabel .Label {margin-bottom:8px;}
.Counter{color:#fff;background-color:rgba(234, 238, 242, 0.5)}

.genTime{float: right;}
.d-flex{min-width:0;}
.listTitle{overflow:hidden;white-space:nowrap;text-overflow: ellipsis;max-width: 100%;}
.listLabels{white-space:nowrap;}

@media (max-width: 600px) {
    body { padding: 8px;}
    .tagTitle{display:none;}
    .LabelTime{display:none;}
}
</style>
{% endblock %}

{% block header %}
<span class="tagTitle"><span>Loading</span><span class="AnimatedEllipsis"></span></span>
<div class="title-right">
    <div class="subnav-search">
        <input type="search" class="form-control subnav-search-input float-left" aria-label="Search site" value="" style="height:32px;">
        <button class="btn float-left" type="submit" onclick="javascript:searchShow()">{{ i18n['Search'] }}</button>
        <svg class="subnav-search-icon octicon octicon-search" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path id="searchSVG" fill-rule="evenodd"></path>
        </svg>
    </div>
    <a href="{{ blogBase['homeUrl'] }}" id="buttonHome" class="btn btn-invisible circle" title="{{ i18n['home'] }}" aria-label="{{ i18n['home'] }}">
        <svg class="octicon" width="16" height="16" aria-hidden="true">
            <path id="pathHome" fill-rule="evenodd"></path>
        </svg>
    </a>
    <a class="btn btn-invisible circle" role="button" tabindex="0" onclick="modeSwitch()" onkeydown="if(event.key==='Enter'||event.key===' '){modeSwitch();}" title="{{ i18n['switchTheme'] }}" aria-label="{{ i18n['switchTheme'] }}" {%- if blogBase['themeMode']=='fix' -%}style="display:none;"{%- endif -%}>
        <svg class="octicon" width="16" height="16" aria-hidden="true">
            <path id="themeSwitch" fill-rule="evenodd"></path>
        </svg>
    </a>
</div>
{% endblock %}

{% block content %}
<div id="taglabel" style="margin-bottom:8px;"></div>
<nav class="SideNav"></nav>
<div class="notFind" style="display:none;font-size:24px;margin:8px;">Not Find</div>
{% endblock %}

{% block script %}
<script>
var BLOG_TITLE = {{ blogBase['title']|tojson }};
var tagList = [];
var labelsCount = {};
var jsonData = null;

document.getElementById("pathHome").setAttribute("d", IconList["home"] || "");
document.getElementById("searchSVG").setAttribute("d", IconList["search"] || "");

var request = new XMLHttpRequest();
request.open("GET", "postList.json");
request.responseType = "text";
request.onload = function(){
    if(request.status < 200 || request.status >= 300){
        showError("load postList.json failed: HTTP " + request.status);
        return;
    }
    try{
        jsonData = JSON.parse(request.responseText);
    }catch(e){
        showError("postList.json is not valid JSON");
        return;
    }
    showList();
    setClassDisplay(hashLabel());
};
request.onerror = function(){
    showError("network error, can not load postList.json");
};
request.send();

function hashLabel(){
    var raw = window.location.hash.slice(1);
    try{
        return decodeURIComponent(raw);
    }catch(e){
        return raw;
    }
}

function showError(msg){
    var tagTitle = document.getElementsByClassName("tagTitle")[0];
    if(tagTitle){ tagTitle.textContent = msg; }
    var notFind = document.getElementsByClassName("notFind")[0];
    if(notFind){ notFind.style.display = "block"; notFind.textContent = msg; }
    document.title = msg;
}

function labelsOf(el){
    try{
        var raw = el.getAttribute("data-labels");
        return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
}

function showList(){
    var SideNav = document.getElementsByClassName("SideNav")[0];
    SideNav.classList.add("border");
    var taglabel = document.getElementById("taglabel");

    jsonData["labelColorDict"] = jsonData["labelColorDict"] || {};
    jsonData["labelColorDict"]["All"] = "#000";
    labelsCount["All"] = 0;

    for(var key in jsonData){
        if(key !== "labelColorDict" && jsonData[key] && Array.isArray(jsonData[key].labels)){
            labelsCount["All"]++;
            jsonData[key].labels.forEach(function(l){
                labelsCount[l] = (labelsCount[l] || 0) + 1;
            });
        }
    }

    var sortedLabelsList = Object.keys(labelsCount).sort(function(a, b){ return labelsCount[b] - labelsCount[a]; });
    sortedLabelsList.forEach(function(label){
        tagList.push(label);
        var btn = document.createElement("button");
        btn.className = "Label";
        btn.style.backgroundColor = jsonData["labelColorDict"][label] || "#8b949e";
        btn.style.padding = "4px";
        btn.textContent = label + " ";

        var labelNum = document.createElement("span");
        labelNum.className = "Counter";
        labelNum.textContent = labelsCount[label];
        btn.appendChild(labelNum);

        btn.addEventListener("click", function(){ updateShowTag(label); });
        taglabel.appendChild(btn);
    });

    for(var id in jsonData){
        var item = jsonData[id];
        if(id === "labelColorDict" || !item || !Array.isArray(item.labels)){ continue; }

        var div = document.createElement("div");
        div.className = "lists";
        div.setAttribute("data-labels", JSON.stringify(item.labels));

        var link = document.createElement("a");
        link.className = "SideNav-item d-flex flex-items-center flex-justify-between";
        link.setAttribute("href", item.postUrl);

        var center = document.createElement("div");
        center.className = "d-flex flex-items-center";

        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "SideNav-icon octicon");
        svg.setAttribute("style", "width:16px;height:16px");
        svg.setAttribute("aria-hidden", "true");
        var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", IconList["post"] || "");
        svg.appendChild(path);

        var title = document.createElement("span");
        title.className = "listTitle";
        title.textContent = item.postTitle;
        center.appendChild(svg);
        center.appendChild(title);

        var listLabels = document.createElement("div");
        listLabels.className = "listLabels";
        item.labels.forEach(function(l){
            var labelEl = document.createElement("span");
            labelEl.className = "Label LabelName";
            labelEl.style.backgroundColor = jsonData["labelColorDict"][l] || "#8b949e";
            labelEl.textContent = l;
            listLabels.appendChild(labelEl);
        });

        var timeEl = document.createElement("span");
        timeEl.className = "Label LabelTime";
        timeEl.style.backgroundColor = item.dateLabelColor || "#8b949e";
        timeEl.textContent = item.createdDate || "";
        listLabels.appendChild(timeEl);

        link.appendChild(center);
        link.appendChild(listLabels);
        div.appendChild(link);
        SideNav.appendChild(div);
    }
}

function updateShowTag(label){
    setClassDisplay(label);
    history.replaceState(null, "", "#" + encodeURIComponent(label));
}

function setClassDisplay(label){
    var lists = document.getElementsByClassName("lists");
    var tagTitle = document.getElementsByClassName("tagTitle")[0];
    var notFind = document.getElementsByClassName("notFind")[0];
    var searchInput = document.getElementsByClassName("subnav-search-input")[0];

    if(!label){ label = "All"; }
    tagTitle.textContent = "Tag #" + label;
    document.title = label + " - " + BLOG_TITLE;
    searchInput.value = "";

    if(label === "All"){
        for(var i=0;i<lists.length;i++){ lists[i].style.display = "block"; }
        notFind.style.display = "none";
        return;
    }

    if(tagList.indexOf(label) !== -1){
        for(var j=0;j<lists.length;j++){
            lists[j].style.display = labelsOf(lists[j]).indexOf(label) !== -1 ? "block" : "none";
        }
        notFind.style.display = "none";
        return;
    }

    searchInput.value = label;
    searchShow();
}

function searchShow(){
    var lists = document.getElementsByClassName("lists");
    var tagTitle = document.getElementsByClassName("tagTitle")[0];
    var notFind = document.getElementsByClassName("notFind")[0];
    var input = document.getElementsByClassName("subnav-search-input")[0].value;
    var keyword = input.toUpperCase();
    var hit = 0;

    tagTitle.textContent = "Search #" + input;
    document.title = (input === "" ? "Search" : input) + " - " + BLOG_TITLE;

    for(var i=0;i<lists.length;i++){
        var titleEl = lists[i].querySelector(".listTitle");
        var text = titleEl ? titleEl.textContent.toUpperCase() : "";
        if(text.indexOf(keyword) === -1){
            lists[i].style.display = "none";
        }else{
            lists[i].style.display = "block";
            hit++;
        }
    }

    if(hit === 0){
        notFind.style.display = "block";
        notFind.textContent = 'Not Find "' + input + '"';
    }else{
        notFind.style.display = "none";
    }

    history.replaceState(null, "", "#" + encodeURIComponent(input));
}
</script>
{% endblock %}
