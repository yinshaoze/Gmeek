<div id="footer1">Copyright © <span id="copyrightYear"></span> <a href="{{ blogBase['homeUrl'] }}">{{ blogBase['title'] }}</a></div>
<div id="footer2">
    {%- if blogBase['filingNum']!='' -%}
    <span id="filingNum"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ blogBase['filingNum'] }}</a> • </span>
    {%- endif %}
    <span id="runday"></span><span>Powered by <a href="https://meekdai.com/Gmeek.html" target="_blank" rel="noopener noreferrer">Gmeek</a></span>
</div>

<script>
var now = new Date();
document.getElementById("copyrightYear").innerHTML = now.getFullYear();

var startSiteStr = {{ (blogBase['startSite'] or '')|tojson }};
if(startSiteStr !== ""){
    var startSite = new Date(startSiteStr);
    if(!isNaN(startSite.getTime())){
        var diffDay = Math.floor((now.getTime() - startSite.getTime()) / (1000*60*60*24));
        document.getElementById("runday").innerHTML = {{ i18n['run']|tojson }} + diffDay + {{ i18n['days']|tojson }} + " • ";
    }
}
</script>
